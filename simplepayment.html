<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Payment - PupWeb</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="assets/styles.css" />
    <style>
      .payment-container {
        display: flex;
        gap: 2.5rem;
        justify-content: center;
        align-items: flex-start;
        margin: 3rem auto;
        max-width: 900px;
        flex-wrap: wrap;
      }
      .billing-form,
      .payment-form {
        flex: 1 1 340px;
        min-width: 300px;
        max-width: 400px;
        background: #23242a;
        border-radius: 18px;
        box-shadow: 0 4px 24px rgba(230, 126, 34, 0.1);
        padding: 2.5rem 2rem 2rem 2rem;
        margin-bottom: 2rem;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        animation: fadeInUp 0.9s cubic-bezier(0.4, 2, 0.6, 1);
      }
      .billing-form {
        border-right: 2px solid rgba(230, 126, 34, 0.08);
        box-shadow: 4px 0 24px -12px rgba(230, 126, 34, 0.08);
        background: linear-gradient(120deg, #23242a 80%, #181a20 100%);
        animation-delay: 0.1s;
      }
      .billing-form h2 {
        color: #e67e22;
        text-align: left;
        margin-bottom: 1.5rem;
        letter-spacing: 1px;
        font-size: 1.4rem;
        font-weight: bold;
        padding-left: 2px;
      }
      .billing-form label {
        color: #ffb366;
        font-weight: 600;
        margin-bottom: 0.2rem;
        margin-top: 0.5rem;
        display: block;
        letter-spacing: 0.7px;
        font-size: 1rem;
        transition: color 0.2s;
      }
      .billing-form input {
        width: 100%;
        padding: 0.8rem 1rem;
        margin-bottom: 0.9rem;
        border: none;
        border-radius: 8px;
        background: #181a20;
        color: #fff;
        font-size: 1.05rem;
        transition: box-shadow 0.2s, background 0.2s;
        box-shadow: 0 1px 6px rgba(230, 126, 34, 0.1);
      }
      .billing-form input:focus {
        outline: none;
        background: #23242a;
        box-shadow: 0 0 0 2px #e67e22;
      }
      .payment-form {
        max-width: 400px;
        margin: 3rem auto;
        background: #23242a;
        border-radius: 18px;
        box-shadow: 0 4px 24px rgba(230, 126, 34, 0.1);
        padding: 2.5rem 2rem 2rem 2rem;
        animation: fadeInUp 0.7s cubic-bezier(0.4, 2, 0.6, 1);
      }
      .payment-form h2 {
        color: #e67e22;
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .payment-form label {
        color: #f5f6fa;
        font-weight: bold;
        margin-bottom: 0.3rem;
        display: block;
        letter-spacing: 0.5px;
      }
      .payment-form input {
        width: 100%;
        padding: 0.7rem;
        margin-bottom: 1.2rem;
        border: none;
        border-radius: 7px;
        background: #181a20;
        color: #fff;
        font-size: 1rem;
        transition: box-shadow 0.2s, background 0.2s;
        box-shadow: 0 1px 4px rgba(230, 126, 34, 0.08);
      }
      .payment-form input:focus {
        outline: none;
        background: #23242a;
        box-shadow: 0 0 0 2px #e67e22;
      }
      .payment-form button {
        width: 100%;
        padding: 0.8rem;
        background: linear-gradient(90deg, #e67e22 60%, #ffb366 100%);
        color: #fff;
        border: none;
        border-radius: 7px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
        margin-top: 0.5rem;
        box-shadow: 0 2px 8px rgba(230, 126, 34, 0.1);
      }
      .payment-form button:hover {
        background: #ca6f1e;
        transform: translateY(-2px) scale(1.02);
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 900px) {
        .payment-container {
          flex-direction: column;
          align-items: stretch;
        }
        .billing-form,
        .payment-form {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PupWeb</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="adopt.html">Free Puppies</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </header>
    <main>
      <div class="payment-container">
        <form class="billing-form" autocomplete="off">
          <h2>Billing Address</h2>
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            maxlength="60"
            placeholder="John Doe"
            required
          />
          <label for="address">Address</label>
          <input
            type="text"
            id="address"
            maxlength="120"
            placeholder="123 Puppy Lane"
            required
          />
          <label for="city">City</label>
          <input
            type="text"
            id="city"
            maxlength="40"
            placeholder="City"
            required
          />
          <label for="state">State/Province</label>
          <input
            type="text"
            id="state"
            maxlength="40"
            placeholder="State"
            required
          />
          <label for="zip">ZIP/Postal Code</label>
          <input
            type="text"
            id="zip"
            maxlength="12"
            placeholder="12345"
            required
          />
          <label for="country">Country</label>
          <input
            type="text"
            id="country"
            maxlength="40"
            placeholder="Country"
            required
          />
        </form>
        <form class="payment-form" autocomplete="off">
          <h2>Card Payment</h2>
          <label for="cardnum">Card Number</label>
          <input
            type="text"
            id="cardnum"
            maxlength="19"
            placeholder="1234 5678 9012 3456"
            required
            pattern="[0-9 ]{19}"
          />
          <label for="exp">Ex.Date</label>
          <input
            type="text"
            id="exp"
            maxlength="5"
            placeholder="MM/YY"
            required
            pattern="(0[1-9]|1[0-2])\/\d{2}"
          />
          <label for="cvv">CVV</label>
          <input
            type="password"
            id="cvv"
            maxlength="3"
            placeholder="123"
            required
            pattern="\d{3,4}"
          />
          <button type="submit">Pay Now</button>
        </form>
      </div>
    </main>
    <footer>
      <p>&copy; 2025 PupWeb. All rights reserved.</p>
    </footer>
    <style>
      .paw-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(30, 30, 30, 0.85);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: all;
        transition: opacity 0.3s;
      }
      .paw-trail {
        display: flex;
        gap: 16px;
      }
      .paw-print {
        width: 36px;
        height: 36px;
        opacity: 0.5;
        transform: scale(0.7);
        animation: pawTrail 1.2s infinite;
      }
      .paw-print:nth-child(2) {
        animation-delay: 0.2s;
      }
      .paw-print:nth-child(3) {
        animation-delay: 0.4s;
      }
      .paw-print:nth-child(4) {
        animation-delay: 0.6s;
      }
      .paw-print:nth-child(5) {
        animation-delay: 0.8s;
      }
      @keyframes pawTrail {
        0% {
          opacity: 0.2;
          transform: scale(0.7) translateY(0);
        }
        30% {
          opacity: 1;
          transform: scale(1.1) translateY(-10px);
        }
        60% {
          opacity: 0.7;
          transform: scale(0.9) translateY(0);
        }
        100% {
          opacity: 0.2;
          transform: scale(0.7) translateY(0);
        }
      }
    </style>
    <div id="paw-loading" style="display: none">
      <div class="paw-loading-overlay">
        <div class="paw-trail">
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
        </div>
      </div>
    </div>
    <script>
      function showPawLoading() {
        document.getElementById("paw-loading").style.display = "block";
      }
      function hidePawLoading() {
        document.getElementById("paw-loading").style.display = "none";
      }
      // Attach to all buttons
      document.addEventListener("DOMContentLoaded", function () {
        const forms = document.querySelectorAll("form");
        forms.forEach((form) => {
          form.addEventListener("submit", function (e) {
            showPawLoading();
            setTimeout(() => {
              hidePawLoading();
              form.submit();
            }, 1200);
            e.preventDefault();
          });
        });
        // For non-form buttons
        const btns = document.querySelectorAll('button:not([type="submit"])');
        btns.forEach((btn) => {
          btn.addEventListener("click", function (e) {
            showPawLoading();
            setTimeout(hidePawLoading, 1200);
          });
        });
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card Payment - PupWeb</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/credit.css" />
  </head>
  <body>
    <header>
      <h1>PupWeb</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="adopt.html">Free Puppies</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </header>
    <main>
      <div class="payment-container">
        <form
          class="billing-form payment-form"
          autocomplete="off"
          action="process_creditcard.php"
          method="POST"
        >
          <h2>Billing Address</h2>
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            maxlength="60"
            placeholder="John Doe"
            required
          />
          <label for="address">Address</label>
          <input
            type="text"
            id="address"
            name="address"
            maxlength="120"
            placeholder="123 Puppy Lane"
            required
          />
          <label for="city">City</label>
          <input
            type="text"
            id="city"
            name="city"
            maxlength="40"
            placeholder="City"
            required
          />
          <label for="state">State/Province</label>
          <input
            type="text"
            id="state"
            name="state"
            maxlength="40"
            placeholder="State"
            required
          />
          <label for="zip">ZIP/Postal Code</label>
          <input
            type="text"
            id="zip"
            name="zip"
            maxlength="12"
            placeholder="12345"
            required
          />
          <label for="country">Country</label>
          <input
            type="text"
            id="country"
            name="country"
            maxlength="40"
            placeholder="Country"
            required
          />
          <h2>Credit Card Payment</h2>
          <label for="cardnum">Card Number</label>
          <input
            type="text"
            id="cardnum"
            name="cardnum"
            maxlength="19"
            placeholder="1234 5678 9012 3456"
            required
            pattern="[0-9 ]{19}"
          />
          <label for="exp">Ex.Date</label>
          <input
            type="text"
            id="exp"
            name="exp"
            maxlength="5"
            placeholder="MM/YY"
            required
            pattern="(0[1-9]|1[0-2])\/\d{2}"
          />
          <label for="cvv">CVV</label>
          <input
            type="password"
            id="cvv"
            name="cvv"
            maxlength="4"
            placeholder="123"
            required
            pattern="\d{3,4}"
          />
          <button type="submit">Pay Now</button>
        </form>
      </div>
    </main>
    <footer>
      <p>&copy; 2025 PupWeb. All rights reserved.</p>
    </footer>

    <div id="paw-loading" style="display: none">
      <div class="paw-loading-overlay">
        <div class="paw-trail">
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
          <svg class="paw-print" viewBox="0 0 32 32">
            <ellipse cx="16" cy="28" rx="7" ry="4" fill="#fff" />
            <ellipse cx="6" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="26" cy="16" rx="3" ry="4" fill="#fff" />
            <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fff" />
            <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fff" />
          </svg>
        </div>
      </div>
    </div>
    <script>
      function showPawLoading() {
        document.getElementById("paw-loading").style.display = "block";
      }
      function hidePawLoading() {
        document.getElementById("paw-loading").style.display = "none";
      }
      // Attach to all buttons
      document.addEventListener("DOMContentLoaded", function () {
        const forms = document.querySelectorAll("form");
        forms.forEach((form) => {
          form.addEventListener("submit", function (e) {
            showPawLoading();
            setTimeout(() => {
              hidePawLoading();
              form.submit();
            }, 1200);
            e.preventDefault();
          });
        });
        // For non-form buttons
        const btns = document.querySelectorAll('button:not([type="submit"])');
        btns.forEach((btn) => {
          btn.addEventListener("click", function (e) {
            showPawLoading();
            setTimeout(hidePawLoading, 1200);
          });
        });
      });
    </script>
  </body>
</html>
